name: Build theme release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cybersecurity:
    permissions:
      contents: read
    uses: ./.github/workflows/cybersecurity.yml
  dependency-audit:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security-audit.yml
  wordpress-security:
    permissions:
      contents: read
    uses: ./.github/workflows/wordpress-quality.yml
  repository-security:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/repository-security.yml
  release:
    permissions:
      contents: write
    needs: [cybersecurity, dependency-audit, wordpress-security, repository-security]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce MEC plugin isolation
        shell: bash
        run: |
          set -euo pipefail
          forbidden_paths=(
            "webnus/modern-events-calendar"
            "webnus/modern-events-calendar-lite"
            "single-mec-events.php"
            "archive-mec-events.php"
            "taxonomy-mec-category.php"
            "header-mec.php"
            "footer-mec.php"
          )
          for path in "${forbidden_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "::error file=$path::MEC must remain plugin-owned; remove this theme override."
              exit 1
            fi
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Verify tag and theme version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          theme_version="$(sed -n 's/^Version:[[:space:]]*//p' style.css | tr -d '\r' | head -n1)"
          test -n "$theme_version"
          echo "version=$theme_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$theme_version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install production PHP dependencies
        if: steps.existing.outputs.released != 'true'
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Publish Carbon Fields browser assets
        if: steps.existing.outputs.released != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/carbon-fields/core/Libraries/Sidebar_Manager
          cp -R vendor/htmlburger/carbon-fields/build public/carbon-fields/
          cp -R vendor/htmlburger/carbon-fields/core/Libraries/Sidebar_Manager/assets \
            public/carbon-fields/core/Libraries/Sidebar_Manager/
          # Carbon Fields loads the readable builds only under SCRIPT_DEBUG, and
          # app/carbon-fields/_init.php falls back to the .min files then. Drop
          # each readable build (about 15 MB) that has a minified twin.
          find public/carbon-fields/build -type f \( -name '*.js' -o -name '*.css' \) ! -name '*.min.*' -print0 |
            while IFS= read -r -d '' file; do
              min="${file%.*}.min.${file##*.}"
              if [ -s "$min" ]; then rm "$file"; fi
            done

      - name: Check PHP syntax
        if: steps.existing.outputs.released != 'true'
        shell: bash
        run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './build/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Build installable WordPress ZIP
        if: steps.existing.outputs.released != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/adventistai
          rsync -a ./ build/adventistai/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='/build/' \
            --exclude='/vendor/htmlburger/carbon-fields/build/' \
            --exclude='/vendor/roots/acorn/tests/' \
            --exclude='/tests/' \
            --exclude='/docs/' \
            --exclude='/scripts/' \
            --exclude='/package-lock.json' \
            --exclude='/composer.lock' \
            --exclude='/jsconfig.json' \
            --exclude='/phpcs-security.xml.dist' \
            --exclude='/webnus/modern-events-calendar/' \
            --exclude='/webnus/modern-events-calendar-lite/' \
            --exclude='/single-mec-events.php' \
            --exclude='/archive-mec-events.php' \
            --exclude='/taxonomy-mec-category.php' \
            --exclude='/header-mec.php' \
            --exclude='/footer-mec.php' \
            --exclude='dist/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='*.log' \
            --exclude='*~*'
          test -s build/adventistai/public/carbon-fields/build/classic/core.min.js
          test -s build/adventistai/public/carbon-fields/build/classic/metaboxes.min.js
          test -s build/adventistai/public/carbon-fields/build/gutenberg/core.min.js
          test -s build/adventistai/public/carbon-fields/build/gutenberg/metaboxes.min.js
          test -s build/adventistai/public/carbon-fields/core/Libraries/Sidebar_Manager/assets/css/app.css
          test -s build/adventistai/public/carbon-fields/core/Libraries/Sidebar_Manager/assets/js/app.js
          test -s build/adventistai/vendor/roots/acorn/src/Roots/helpers.php
          test -s build/adventistai/colors.json
          test ! -e build/adventistai/public/carbon-fields/build/classic/vendor.js
          test ! -e build/adventistai/vendor/roots/acorn/tests
          test ! -e build/adventistai/tests
          cd build
          zip -qr adventistai.zip adventistai
          unzip -tq adventistai.zip

      - name: Publish GitHub release
        if: steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" build/adventistai.zip \
            --target "$GITHUB_SHA" \
            --title "Adventistai ALPS ${{ steps.version.outputs.version }}" \
            --generate-notes
