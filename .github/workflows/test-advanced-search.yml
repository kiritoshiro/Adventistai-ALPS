name: Test advanced search

on:
  push:
    branches:
      - feature/advanced-search
  pull_request:
    paths:
      - 'inc/search/**'
      - 'assets/js/adv-search*.js'
      - 'searchform.php'
      - 'resources/views/search.blade.php'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check PHP syntax
        run: find inc/search tests/search -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run search unit checks
        run: php tests/search/run.php
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/adv-search.js
          node --check assets/js/adv-search-admin.js
