name: Cybersecurity baseline
'on':
  pull_request: null
  schedule:
  - cron: 31 6 * * 2
  workflow_dispatch: null
  workflow_call: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: cybersecurity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Cybersecurity baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install pinned Semgrep
      run: python -m pip install semgrep==1.178.0
    - name: Source security (Semgrep CE)
      run: python .github/security/semgrep_scan.py
