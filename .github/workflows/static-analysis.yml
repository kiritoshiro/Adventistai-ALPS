name: Static Analysis

# Reusable: runs only through security-gate.yml, which owns the triggers,
# schedule and concurrency.
on:
  workflow_call:

permissions: {}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: true
          output: results

      - name: Upload CodeQL SARIF report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-javascript-typescript-sarif
          path: results/*.sarif
          if-no-files-found: error
          retention-days: 14

  suspicious-php:
    name: Suspicious PHP patterns
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Look for risky PHP constructs
        shell: bash
        run: |
          set -euo pipefail
          echo 'Scanning application PHP for high-risk constructs...'
          matches="$(grep -RInE \
            --include='*.php' \
            --exclude-dir=vendor \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            '(^|[^[:alnum:]_])(eval|assert|base64_decode|gzinflate|gzuncompress|shell_exec|passthru|proc_open|popen|system|exec)[[:space:]]*\(' . || true)"

          if [ -n "$matches" ]; then
            echo "$matches"
            echo '::error::Potentially dangerous PHP constructs found. Review the matches above.'
            exit 1
          fi

          echo 'No suspicious PHP constructs found.'
