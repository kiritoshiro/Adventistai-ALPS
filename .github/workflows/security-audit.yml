name: Security Audit

# Reusable: runs only through security-gate.yml, which owns the triggers,
# schedule and concurrency.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  composer:
    name: Composer vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

  npm:
    name: npm vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Audit npm production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Fails on every high/critical advisory except narrow, dated exceptions in
      # .github/security/npm-audit-exceptions.json (build tooling only).
      - name: Audit complete npm dependency graph
        run: python3 .github/security/npm_audit.py

  secrets:
    name: Secret leak scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
