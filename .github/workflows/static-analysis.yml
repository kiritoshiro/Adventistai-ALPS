name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '47 4 * * 2'
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          upload: false
          output: ../results

      - name: Upload CodeQL SARIF report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codeql-javascript-typescript-sarif
          path: ../results/*.sarif
          if-no-files-found: error
          retention-days: 14

  suspicious-php:
    name: Suspicious PHP patterns
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Look for risky PHP constructs
        shell: bash
        run: |
          set -euo pipefail
          echo 'Scanning application PHP for high-risk constructs...'
          matches="$(grep -RInE \
            --include='*.php' \
            --exclude-dir=vendor \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            '(^|[^[:alnum:]_])(eval|assert|base64_decode|gzinflate|gzuncompress|shell_exec|passthru|proc_open|popen|system|exec)[[:space:]]*\(' . || true)"

          if [ -n "$matches" ]; then
            echo "$matches"
            echo '::error::Potentially dangerous PHP constructs found. Review the matches above.'
            exit 1
          fi

          echo 'No suspicious PHP constructs found.'
