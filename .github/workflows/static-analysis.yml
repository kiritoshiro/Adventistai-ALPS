name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '47 4 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  suspicious-php:
    name: Suspicious PHP patterns
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Look for risky PHP constructs
        shell: bash
        run: |
          set -euo pipefail
          echo 'Scanning application PHP for high-risk constructs...'
          matches="$(grep -RInE \
            --include='*.php' \
            --exclude-dir=vendor \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            '(^|[^[:alnum:]_])(eval|assert|base64_decode|gzinflate|gzuncompress|shell_exec|passthru|proc_open|popen|system|exec)[[:space:]]*\(' . || true)"

          if [ -n "$matches" ]; then
            echo "$matches"
            echo '::error::Potentially dangerous PHP constructs found. Review the matches above.'
            exit 1
          fi

          echo 'No suspicious PHP constructs found.'
